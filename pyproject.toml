[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyvla"
version = "0.1.0"
description = "Modular VLA research framework with composable blocks and Hydra configs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "minh-ub", email = "tranhminh8464@gmail.com"}
]
keywords = ["vision-language-action", "robotics", "vla", "pytorch", "hydra"]

dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pytorch-lightning>=2.2.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "timm>=1.0.0",
    "transformers>=4.40.0",
    "wandb>=0.16.0",
    "einops>=0.7.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "h5py>=3.10.0",
    "webdataset>=0.2.86",
    "tensorboard>=2.15.0",
    "lerobot>=0.4.0",
]

[project.optional-dependencies]
eval = [
    "gymnasium>=0.29.0",
    "gym-pusht>=0.1.0",
    "pymunk>=6.0,<7.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.4.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=vla --cov-report=term-missing --cov-report=html"

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C90"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
