# Default training configuration
# Used by scripts/train.py via Hydra (cfg.train)

name: default

# --- Optimizer (flat keys read by VLALightningModule) ---
learning_rate: 1.0e-4
weight_decay: 1.0e-4
warmup_steps: 1000

# --- DataLoader ---
batch_size: 32
num_workers: 4

# --- Training loop ---
epochs: 100  # Preferred parameter name
max_epochs: 100  # Fallback for backwards compatibility
gradient_accumulation_steps: 1
gradient_clip_val: 1.0

# --- Mixed precision ---
# Options: "32", "16-mixed", "bf16-mixed"
precision: "bf16-mixed"

# --- Hardware ---
# "auto" = use all available GPUs; or set integer (e.g. 1)
devices: "auto"

# --- Logging ---
use_wandb: false
log_every_n_steps: 50
val_check_interval: 0.25

# --- Checkpointing ---
checkpoint:
  save_top_k: 3
  monitor: "val/loss"
  mode: "min"
  save_last: true

# --- Early stopping ---
early_stopping:
  patience: 10
  min_delta: 0.001
