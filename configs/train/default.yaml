# Default training configuration
# Used by Phase 11 training loop

# Optimizer
optimizer:
  name: AdamW
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

# Scheduler
scheduler:
  name: CosineAnnealingLR
  T_max: ${train.max_epochs}
  eta_min: 1.0e-6

# Training loop
max_epochs: 100
batch_size: 32
gradient_accumulation_steps: 1
gradient_clip_val: 1.0

# Mixed precision
precision: "bf16-mixed"

# Checkpointing
checkpoint:
  save_top_k: 3
  monitor: "val/loss"
  mode: "min"
  save_last: true

# Logging
log_every_n_steps: 50
val_check_interval: 0.25

# Early stopping
early_stopping:
  patience: 10
  min_delta: 0.001
