# @package _global_

defaults:
  - override /data: lerobot

data:
  repo_id: lerobot/pusht
  image_key: observation.image
  action_dim: 2
  # PushT observation.state is [agent_x, agent_y] (2D only — no block state).
  # No slicing needed.

model:
  action:
    action_dim: 2
    num_bins: 256
  affordance:
    enabled: true
    state_dim: 2     # agent position [x, y]
    hidden_dim: 256
  auxiliary_loss_weight: 0.1

train:
  epochs: 50
  batch_size: 32               # Increased from 16 → smoother gradient, better GPU utilization
  num_workers: 8
  learning_rate: 3e-4          # Peak LR — cosine schedule decays this to ~0 by end
  warmup_steps: 500            # Linear warmup from 0 → 3e-4 over first 500 steps
  precision: "16-mixed"
  log_every_n_steps: 10
  use_wandb: false
  # Disable early stopping — let model train full 50 epochs.
  # Previous runs were stopped at epoch 12-13 while loss still dropping.
  early_stopping:
    enabled: false
